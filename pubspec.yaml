name: logitrack
description: "Enterprise Inventory & Warehouse Mobility"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  fl_chart: ^0.69.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/

fonts:
  - family: Cairo
    fonts:
      - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf